<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#08090d"/>

  <!-- Terminal prompt header -->
  <text x="80" y="120"
        font-family="Commit Mono"
        font-weight="400"
        font-size="24"
        fill="#7d8590">~/portfolio $ whoami</text>

  <!-- Cursor block — echoes the favicon -->
  <rect x="80" y="220" width="18" height="76" fill="#60FBA3"/>

  <!-- Name -->
  <text x="122" y="284"
        font-family="Archivo"
        font-weight="900"
        font-style="italic"
        font-size="120"
        fill="#60FBA3"
        letter-spacing="-4">franbalam</text>

  <!-- Tagline -->
  <text x="82" y="376"
        font-family="Commit Mono"
        font-weight="400"
        font-size="28"
        fill="#f0f2f5">software developer</text>

  <text x="82" y="418"
        font-family="Commit Mono"
        font-weight="400"
        font-size="22"
        fill="#b4bcc6">linux · backend · low-level · mobile</text>

  <!-- Footer rule + site URL -->
  <line x1="80" y1="540" x2="1120" y2="540"
        stroke="#60FBA3" stroke-opacity="0.14" stroke-width="1"/>

  <text x="80" y="585"
        font-family="Commit Mono"
        font-weight="400"
        font-size="20"
        fill="#7d8590">franbalam.pages.dev</text>
</svg>