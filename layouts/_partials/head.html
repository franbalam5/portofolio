<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>
	{{- if .IsHome -}}
		{{ site.Title }}
	{{- else -}}
		{{ .Title }} · {{ site.Title }}
	{{- end -}}
</title>

<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

{{/* Archivo — headings only, 700/800/900 */}}
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,700;0,800;0,900;1,700;1,800;1,900&display=swap" rel="stylesheet">

{{/* Font Awesome — project icons, kept from theme */}}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

{{ partial "head/css.html" . }}
{{ partial "head/js.html" . }}
{{ partial "head/math.html" . }}
